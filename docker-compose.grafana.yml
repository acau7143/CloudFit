# Grafana 자동 설정 (decisions/0015 단계 3): 데이터소스와 대시보드를 시작할 때 자동으로 만든다.
# scripts/install_server.sh 가 docker-compose.yml 과 함께 이 파일을 자동으로 쓴다.
# 직접 쓸 때:  docker compose -f docker-compose.yml -f docker-compose.grafana.yml up -d
#
# 이 파일은 일부러 docker-compose.yml 과 분리했다. 이미 수동으로 만든 Grafana(데이터소스·대시보드)가 있는 서버에서
# 그냥 `docker compose up -d` 를 하면 이 설정이 적용되지 않아 기존 Grafana 가 영향을 받지 않는다.
# (같은 uid 의 데이터소스가 다른 이름으로 이미 있으면 프로비저닝 오류로 Grafana 가 시작하지 못한다. runbook 참고)
services:
  grafana:
    # 대시보드(v2 스키마)를 만든 Grafana 13.1 계열로 고정한다. latest 는 v2 파일 지원이 바뀔 수 있다.
    image: grafana/grafana:13.1.8
    environment:
      # 처음 기동할 때만 적용된다 (이미 만들어진 grafana_data 볼륨에는 영향 없음). 비어 있으면 admin.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # grafana/provisioning/datasources/postgres.yaml 이 DB 접속 비밀번호로 쓴다.
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard:/etc/grafana/dashboards:ro
